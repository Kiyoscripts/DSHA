name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;26.3.11579264"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore verified full offline assets
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/dsha-official.apk \
            https://github.com/DSH-APP/DSHA/releases/download/v0.1.5-rc2/dsha-0.1.5-rc2.apk
          printf '%s  %s\n' \
            85cb7c7213681ced654788f940b16313b3b5e2b662add87432ede95446a30658 \
            /tmp/dsha-official.apk | sha256sum --check --strict
          python3 tools/prepare-full-build-assets.py /tmp/dsha-official.apk

      - name: Run unit tests
        env:
          DSHA_PYTHON: python3
        run: ./gradlew :app:testStandardDebugUnitTest --no-daemon

      - name: Build debug APKs
        env:
          DSHA_PYTHON: python3
        run: ./gradlew :app:assembleStandardDebug :app:assembleLowDebug --no-daemon

      - name: Audit standard APK assets
        run: python3 tools/audit-standard-apk.py app/build/outputs/apk/standard/debug/app-standard-debug.apk

      - name: Confirm full offline assets
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          for path in (
              'app/build/outputs/apk/standard/debug/app-standard-debug.apk',
              'app/build/outputs/apk/low/debug/app-low-debug.apk',
          ):
              with ZipFile(path) as apk:
                  names = set(apk.namelist())
                  required = {
                      'assets/offline-rootfs.bin',
                      'assets/dsh-runtime.bin',
                      'assets/ubuntu-tools.bin',
                  }
                  missing = required - names
                  if missing:
                      raise SystemExit(f'{path}: missing full assets: {sorted(missing)}')
                  print(path, 'contains full offline assets')
          PY

      - name: Create checksums
        run: |
          sha256sum app/build/outputs/apk/standard/debug/app-standard-debug.apk \
            > app/build/outputs/apk/standard/debug/app-standard-debug.apk.sha256
          sha256sum app/build/outputs/apk/low/debug/app-low-debug.apk \
            > app/build/outputs/apk/low/debug/app-low-debug.apk.sha256

      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-standard-debug
          path: |
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
            app/build/outputs/apk/standard/debug/app-standard-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-low-debug
          path: |
            app/build/outputs/apk/low/debug/app-low-debug.apk
            app/build/outputs/apk/low/debug/app-low-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
